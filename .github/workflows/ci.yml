name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CI kapsamı regresyonları
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Değişiklik kapsamı
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_EVENT: ${{ github.event_name }}
        run: python3 .github/scripts/ci_scope.py

      - name: Belge kontrolleri
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --check $env:BASE_SHA $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Belge diff kontrolü başarısız.' }
          ./.github/scripts/Validate-Documentation.ps1

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.server == 'true'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.server == 'true' || steps.scope.outputs.compose == 'true'
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            src/Server/packages.lock.json
            tests/Server.Tests/packages.lock.json

      - name: Web bağımlılıkları
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.server == 'true'
        run: npm ci --ignore-scripts
        working-directory: src/Web

      - name: Sunucu testleri için statik web çıktısı
        if: steps.scope.outputs.server == 'true' && steps.scope.outputs.web == 'false'
        run: npm run build
        working-directory: src/Web

      - name: Web kontrolleri
        if: steps.scope.outputs.web == 'true'
        run: |
          npm run typecheck
          npm run lint
          mapfile -t tests < <(jq -r '.web[]' ../../.github/test-plan.json)
          npm test -- "${tests[@]}"
          npm run build
        working-directory: src/Web

      - name: Sunucu bağımlılıkları
        if: steps.scope.outputs.server == 'true'
        run: dotnet restore FirmaRandevu.slnx --locked-mode

      - name: Sunucu kontrolleri
        if: steps.scope.outputs.server == 'true'
        run: |
          dotnet build FirmaRandevu.slnx --no-restore
          mapfile -t tests < <(jq -r '.server[]' .github/test-plan.json)
          args=()
          for test in "${tests[@]}"; do args+=(-class "$test"); done
          dotnet run --project tests/Server.Tests/Server.Tests.csproj --no-build -- "${args[@]}"
          dotnet format FirmaRandevu.slnx --verify-no-changes --no-restore

      - name: İlgili operatör imajının paketleme kontrolü
        if: steps.scope.outputs.server == 'true' || steps.scope.outputs.web == 'true' || steps.scope.outputs.compose == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/Operator src/Server src/Web/operator.html src/Web/src/features/subscription-operator src/Web/src/app/api.ts src/Web/src/app/money.ts src/Web/src/app/format.ts src/Web/src/styles src/Web/src/assets/fonts src/Web/vite.config.ts src/Web/package.json src/Web/package-lock.json deploy/Dockerfile.operator deploy/compose.subscription-operator.yaml deploy/initialize_synthetic.py deploy/New-SyntheticCertificates.ps1 deploy/app-user-grants.sql deploy/subscription-operator-target.sql deploy/synthetic_recovery.py deploy/synthetic_update.py deploy/monitor_synthetic.py deploy/Protect-SyntheticRecovery.ps1 deploy/Invalidate-RestoredPublicAccess.sql tests/Deployment Directory.Build.props global.json)"
          if [ -n "$changed" ]; then
            docker build -f deploy/Dockerfile.operator -t firma-randevu-operator:ci .
            test "$(docker image inspect firma-randevu-operator:ci --format '{{.Config.User}}')" != root
          fi

      - name: Geçici yerel test parolaları
        if: steps.scope.outputs.compose == 'true'
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> deploy/.env
          echo "APP_DB_PASSWORD=$(openssl rand -hex 32)" >> deploy/.env
          echo 'DB_PORT=55432' >> deploy/.env

      - name: Compose ve imaj
        if: steps.scope.outputs.compose == 'true'
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.local.yaml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.local.yaml up -d --build --wait
          test "$(docker image inspect firma-randevu:local --format '{{.Config.User}}')" != root
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep 'lang="tr"'

      - name: Veritabanı yeniden başlatma kanıtı
        if: steps.scope.outputs.compose == 'true'
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.local.yaml exec -T db \
            psql -U postgres -d firma_randevu -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE p01_restart_check (value text NOT NULL); INSERT INTO p01_restart_check VALUES ('korundu');"
          docker compose --env-file deploy/.env -f deploy/compose.local.yaml restart db
          for attempt in $(seq 1 20); do
            if docker compose --env-file deploy/.env -f deploy/compose.local.yaml exec -T db \
              pg_isready -U postgres -d firma_randevu >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$(docker compose --env-file deploy/.env -f deploy/compose.local.yaml exec -T db \
            psql -U postgres -d firma_randevu -tAc 'SELECT value FROM p01_restart_check;')" = korundu
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/ready

      - name: İlgili sentetik A/B kurulum kabulü
        if: steps.scope.outputs.compose == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- deploy/initialize_synthetic.py deploy/New-SyntheticCertificates.ps1 deploy/app-user-grants.sql tests/Deployment/verify_synthetic.py tests/Deployment/verify_isolation.py)"
          if [ -n "$changed" ]; then
            dotnet tool restore
            python3 tests/Deployment/verify_synthetic.py --instance fr-synthetic-ci --ports 8203 8204 8205 \
              --app-image "$(docker image inspect firma-randevu:local --format '{{.Id}}')" \
              --operator-image "$(docker image inspect firma-randevu-operator:ci --format '{{.Id}}')" \
              --postgres-image "$(docker image inspect postgres:18.6-trixie --format '{{.Id}}')"
          fi

      - name: İlgili şifreli temiz restore kabulü
        if: steps.scope.outputs.compose == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- deploy/synthetic_recovery.py deploy/Protect-SyntheticRecovery.ps1 deploy/Invalidate-RestoredPublicAccess.sql deploy/initialize_synthetic.py deploy/New-SyntheticCertificates.ps1 deploy/app-user-grants.sql deploy/subscription-operator-target.sql tests/Deployment/verify_recovery.py)"
          if [ -n "$changed" ]; then
            dotnet tool restore
            python3 tests/Deployment/verify_recovery.py --instance fr-synthetic-recovery-ci --ports 8243 8244 8245 \
              --app-image "$(docker image inspect firma-randevu:local --format '{{.Id}}')" \
              --operator-image "$(docker image inspect firma-randevu-operator:ci --format '{{.Id}}')" \
              --postgres-image "$(docker image inspect postgres:18.6-trixie --format '{{.Id}}')"
          fi

      - name: İlgili tek firma imaj güncelleme ve geri dönüş kabulü
        if: steps.scope.outputs.compose == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- deploy/synthetic_update.py deploy/initialize_synthetic.py deploy/synthetic_recovery.py deploy/Protect-SyntheticRecovery.ps1 deploy/app-user-grants.sql tests/Deployment/verify_recovery.py tests/Deployment/verify_update.py)"
          if [ -n "$changed" ]; then
            dotnet tool restore
            python3 tests/Deployment/verify_update.py --instance fr-synthetic-update-ci --ports 8263 8264 8265 \
              --operator-image "$(docker image inspect firma-randevu-operator:ci --format '{{.Id}}')" \
              --postgres-image "$(docker image inspect postgres:18.6-trixie --format '{{.Id}}')"
          fi

      - name: İlgili yerel izleme ve kayıp-kurtarma kabulü
        if: steps.scope.outputs.compose == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- deploy/monitor_synthetic.py deploy/initialize_synthetic.py deploy/synthetic_recovery.py deploy/New-SyntheticCertificates.ps1 deploy/Protect-SyntheticRecovery.ps1 deploy/Invalidate-RestoredPublicAccess.sql deploy/app-user-grants.sql deploy/subscription-operator-target.sql deploy/subscription-operator-identity.sql tests/Deployment/verify_monitoring.py tests/Deployment/verify_recovery.py tests/Deployment/verify_synthetic.py tests/Deployment/verify_isolation.py)"
          if [ -n "$changed" ]; then
            dotnet restore src/Server/Server.csproj --locked-mode
            dotnet build src/Server/Server.csproj --no-restore
            dotnet tool restore
            python3 tests/Deployment/verify_monitoring.py --instance fr-synthetic-monitor-ci --ports 8283 8284 8285 \
              --app-image "$(docker image inspect firma-randevu:local --format '{{.Id}}')" \
              --operator-image "$(docker image inspect firma-randevu-operator:ci --format '{{.Id}}')" \
              --postgres-image "$(docker image inspect postgres:18.6-trixie --format '{{.Id}}')"
          fi

      - name: Yerel test servislerini durdur
        if: always()
        run: |
          if [ -f deploy/.env ]; then
            docker compose --env-file deploy/.env -f deploy/compose.local.yaml down
          fi
